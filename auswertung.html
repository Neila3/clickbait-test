<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Klick-Auswertung</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .ergebnis {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            font-size: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #gesamt {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>📊 Klick-Auswertung</h1>

    <div class="ergebnis">
        Link 1: <span id="link1">0</span> Klicks
    </div>

    <div class="ergebnis">
        Link 2: <span id="link2">0</span> Klicks
    </div>

    <div class="ergebnis">
        Link 3: <span id="link3">0</span> Klicks
    </div>

    <div class="ergebnis">
        Gesamt: <span id="gesamt">0</span> Klicks
    </div>

    <button onclick="loadClicks()">
        🔄 Aktualisieren
    </button>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://bltkmbsrvzjokehselko.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_HKcc78JW8kVjXaogUWvQUg_lKTopI9T";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        async function loadClicks() {

            const { data, error } = await supabaseClient
                .from("Klicks")
                .select("link");

            if (error) {

                console.error(
                    "❌ Fehler beim Abrufen:",
                    error
                );

                return;
            }


            let link1 = 0;
            let link2 = 0;
            let link3 = 0;


            data.forEach(row => {

                if (row.link === "Link 1") {
                    link1++;
                }

                if (row.link === "Link 2") {
                    link2++;
                }

                if (row.link === "Link 3") {
                    link3++;
                }

            });


            document.getElementById("link1").textContent = link1;
            document.getElementById("link2").textContent = link2;
            document.getElementById("link3").textContent = link3;

            document.getElementById("gesamt").textContent =
                link1 + link2 + link3;
        }


        // Beim Öffnen automatisch laden
        loadClicks();

    </script>

</body>
</html>
