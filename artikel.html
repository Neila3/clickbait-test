  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;

<body>
<main>

  <article id="artikeltext" class="artikeltext"></article>

  </button>

  <p id="lesezeit" class="lesezeit">

  </p>
</main>

<script>
  // ---------------------------------------------
  // 1. SUPABASE
  // ---------------------------------------------

  const SUPABASE_URL =
    "https://bltkmbsrvzjokehselko.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_HKcc78JW8kVjXaogUWvQUg_lKTopI9T";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ---------------------------------------------
  // 2. DATEN AUS DER URL
  // ---------------------------------------------

  const params = new URLSearchParams(window.location.search);

  const themaId = params.get("themaId") || "";
  const thema = params.get("thema") || "Allgemein";
  const headline = params.get("headline") || "Artikel";
  const headlineId = params.get("headlineId") || "";
  const teilnehmerId = params.get("teilnehmerId") || "";

  document.getElementById("headline").textContent = headline;
  document.title = headline;


  // ---------------------------------------------
  // 3. ARTIKELTEXTE
  // ---------------------------------------------

  const artikelTexte = {
    schlaf: `
      <p>Schlaf spielt eine wichtige Rolle für Aufmerksamkeit,
      Gedächtnis und Lernen. Während der Nacht verarbeitet das Gehirn

      <p>Wer zu wenig schläft, kann sich am nächsten Tag müder fühlen

      <p>Aus einem einzelnen schlechten Schlaftag lässt sich allerdings

    social_media: `
      <p>Soziale Medien gehören für viele Jugendliche zum Alltag.
      Sie ermöglichen es, mit Freunden in Kontakt zu bleiben,
      Informationen zu erhalten und eigene Interessen zu entdecken.
      Gleichzeitig beschäftigen sich Forschende zunehmend damit,
      wie die Nutzung sozialer Plattformen mit dem Wohlbefinden
      zusammenhängt.</p>

      <p>Ein möglicher Einflussfaktor ist der Vergleich mit anderen.
      In sozialen Netzwerken sehen Nutzerinnen und Nutzer häufig
      ausgewählte Momente aus dem Leben anderer Menschen. Solche Beiträge

      <p>Die Auswirkungen sind jedoch nicht bei allen Menschen gleich.
      Manche erleben soziale Medien als Unterstützung und fühlen sich

      <p>Deshalb lässt sich die Wirkung sozialer Medien nicht allein
      anhand der täglichen Nutzungsdauer beurteilen. Entscheidend ist
      unter anderem, welche Inhalte konsumiert werden und wie sich die
      Nutzung auf den Alltag auswirkt.</p>
    `,

    fruehstueck: `
      <p>Das Frühstück wird häufig mit Konzentration und Leistungsfähigkeit
      im Schulalltag in Verbindung gebracht. Forschende untersuchen,

      <p>Nach einer längeren Zeit ohne Nahrung kann das Frühstück eine

      <p>Auch die Zusammensetzung einer Mahlzeit kann eine Rolle spielen.

      Nährstoffe. Aus einer bestimmten Frühstücksform lässt sich jedoch

      schliessen.</p>

      <p>Menschen unterscheiden sich darin, wann sie Hunger haben und
      welche Essgewohnheiten zu ihnen passen. Für allgemeine Aussagen
      über Konzentration und Frühstück müssen deshalb mehrere
      Einflussfaktoren berücksichtigt werden.</p>
    `,

    sport: `
      <p>Regelmässige Bewegung wird häufig mit körperlicher Gesundheit
      und psychischem Wohlbefinden in Verbindung gebracht. In der Forschung
      wird unter anderem untersucht, wie sportliche Aktivität mit Stimmung,

      <p>Bewegung kann dabei helfen, Anspannung abzubauen und den Alltag
      zu strukturieren. Manche Menschen erleben Sport auch als Gelegenheit,

      <p>Sport ist jedoch kein allgemeingültiges Mittel gegen jede

      die Erfahrung auch negativ beeinflussen. Zudem unterscheiden sich

      <p>Fachleute betrachten Bewegung deshalb als einen möglichen
      Bestandteil eines gesunden Lebensstils. Für Aussagen über das
      Wohlbefinden müssen daneben weitere Faktoren wie soziale Beziehungen,

    `,

    plastik: `
      <p>Plastik wird in vielen Bereichen des Alltags eingesetzt,
      etwa bei Verpackungen, Kleidung und technischen Geräten.
      Das Material ist vielseitig und häufig langlebig. Genau diese
      Eigenschaften werden zum Problem, wenn Kunststoffabfälle in die

      <p>Plastikabfälle können Gewässer und Böden belasten. Tiere können
      sich in grösseren Kunststoffteilen verfangen oder kleinere Teile

      <p>Die Belastung entsteht entlang des gesamten Lebenszyklus eines
      Produkts. Dabei spielen Herstellung, Nutzung, Entsorgung und Recycling

      wiederverwerten, und Recycling allein verhindert nicht, dass Abfälle
      in die Umwelt gelangen.</p>

      <p>Massnahmen können deshalb an unterschiedlichen Stellen ansetzen:
      etwa bei der Vermeidung unnötiger Verpackungen, einer besseren

      Wie wirksam einzelne Massnahmen sind, hängt von ihrer konkreten
      Umsetzung ab.</p>
    `
  };

  document.getElementById("artikeltext").innerHTML =
    artikelTexte[themaId] ||
    "<p>Für dieses Thema wurde kein Artikel gefunden.</p>";


  // ---------------------------------------------
  // 4. LESEZEITMESSUNG
  // ---------------------------------------------

  const lesezeitElement = document.getElementById("lesezeit");

  // Jede Person und jeder Artikel bekommen einen eigenen lokalen Schlüssel.
  const zeitKey =
    `artikelzeit_${teilnehmerId}_${headlineId}`;

  let gesamtMillisekunden = Number(
    localStorage.getItem(zeitKey) || 0
  );

  let startzeit = document.visibilityState === "visible"
    ? Date.now()
    : null;

  let letzteErfolgreichGespeicherteSekunde = 0;
  let speicherLaeuft = false;
  let speichernErneutNoetig = false;
  let beendet = false;

  function zeitJetzt() {
    if (startzeit === null) {
      return gesamtMillisekunden;
    }

    return gesamtMillisekunden + (Date.now() - startzeit);
  }

  function lokalSichern() {
    const jetzt = Date.now();

    if (startzeit !== null) {
      gesamtMillisekunden += jetzt - startzeit;
      startzeit = jetzt;
    }

    localStorage.setItem(
      zeitKey,
      String(gesamtMillisekunden)
    );

    aktualisiereAnzeige();
  }

  function aktualisiereAnzeige() {
    const sekunden = Math.floor(zeitJetzt() / 1000);

    lesezeitElement.textContent =
      `Erfasste Lesezeit: ${sekunden} Sekunden`;
  }

  async function inSupabaseSpeichern() {
    lokalSichern();

    const sekunden = Math.floor(gesamtMillisekunden / 1000);

    if (sekunden <= 0) return;

    if (speicherLaeuft) {
      speichernErneutNoetig = true;
      return;
    }

    if (sekunden <= letzteErfolgreichGespeicherteSekunde) {
      return;
    }

    speicherLaeuft = true;
    speichernErneutNoetig = false;

    try {
      const { error } = await supabaseClient
        .from("Artikelzeiten")
        .upsert(
          {
            teilnehmer_id: teilnehmerId,
            thema: thema,
            headline_id: headlineId,
            headline: headline,
            sekunden: sekunden
          },
          {
            onConflict: "teilnehmer_id,headline_id"
          }
        );

      if (error) {
        throw error;
      }

      letzteErfolgreichGespeicherteSekunde = sekunden;

      lesezeitElement.textContent =
        `Lesezeit gespeichert: ${sekunden} Sekunden`;

    } catch (error) {
      console.error("Fehler beim Speichern der Lesezeit:", error);

      lesezeitElement.textContent =
        `Lesezeit lokal gesichert: ${sekunden} Sekunden. ` +
        "Speicherung in Supabase fehlgeschlagen.";
    } finally {
      speicherLaeuft = false;

      if (speichernErneutNoetig) {
        speichernErneutNoetig = false;
        inSupabaseSpeichern();
      }
    }
  }

  // Alle zwei Sekunden lokal sichern und synchronisieren.
  const zeitIntervall = setInterval(() => {
    lokalSichern();
    inSupabaseSpeichern();
  }, 2000);

  // Zeit zählt nur, solange der Tab sichtbar ist.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      lokalSichern();
      startzeit = null;
      lokalSichern();
      inSupabaseSpeichern();
    } else if (!beendet) {
      startzeit = Date.now();
      aktualisiereAnzeige();
    }
  });

  // Zusätzlicher Versuch beim Verlassen der Seite.
  window.addEventListener("pagehide", () => {
    beendet = true;

    lokalSichern();
    startzeit = null;

    clearInterval(zeitIntervall);

    inSupabaseSpeichern();
  });

  aktualisiereAnzeige();


  // ---------------------------------------------
  // 5. ZURÜCK ZUM TEST
  // ---------------------------------------------

  document.getElementById("zurueck").addEventListener("click", () => {
    inSupabaseSpeichern();

    // Der Artikel wurde in einem separaten Tab geöffnet.
    window.close();

    // Falls der Browser das Schliessen blockiert:
    setTimeout(() => {
      lesezeitElement.textContent +=
        " Du kannst zum Test-Tab zurückwechseln.";
    }, 300);
  });
</script>
</body>
</html>
