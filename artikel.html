<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nachrichten</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f0f1f3;
      color: #17191d;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    .topline {
      height: 7px;
      background: #c51f32;
    }

    header {
      background: white;
      border-bottom: 1px solid #d5d7db;
    }

    .masthead {
      max-width: 1040px;
      margin: auto;
      padding: 22px 24px 16px;
    }

    .brand {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .brand span {
      color: #c51f32;
    }

    .tagline {
      margin: 7px 0 0;
      color: #626873;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    nav {
      background: #191b20;
      color: white;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-inner {
      max-width: 1040px;
      margin: auto;
      padding: 11px 24px;
    }

    main {
      max-width: 850px;
      margin: 28px auto 50px;
      padding: 34px 45px 45px;
      background: white;
      border: 1px solid #e0e2e6;
      box-shadow: 0 3px 12px #1111110a;
    }

    .category {
      color: #c51f32;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 5vw, 43px);
      line-height: 1.15;
      letter-spacing: -.7px;
      margin: 0 0 18px;
    }

    .meta {
      color: #737984;
      font-size: 12px;
      border-bottom: 1px solid #dedfe3;
      padding-bottom: 18px;
      margin-bottom: 24px;
    }

    .lead {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .article-text {
      font-size: 17px;
      line-height: 1.8;
    }

    .article-text p {
      margin: 0 0 20px;
    }

    .article-text h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      margin: 30px 0 12px;
    }

    .footer {
      border-top: 1px solid #dedfe3;
      margin-top: 35px;
      padding-top: 15px;
      color: #737984;
      font-size: 12px;
    }

    .error {
      color: #a61b1b;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .masthead {
        padding: 18px 17px 13px;
      }

      .brand {
        font-size: 32px;
      }

      .nav-inner {
        padding: 10px 17px;
      }

      main {
        margin: 16px 10px 35px;
        padding: 25px 20px 30px;
      }

      .article-text {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="topline"></div>

  <header>
    <div class="masthead">
      <p class="brand">DIE <span>NACHRICHTEN</span></p>
      <p class="tagline">Aktuelles · Wissen · Gesellschaft</p>
    </div>

    <nav>
      <div class="nav-inner">
        Nachrichten-Test / Artikel
      </div>
    </nav>
  </header>

  <main>
    <div id="artikel">
      <p>Artikel wird geladen ...</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://bltkmbsrvzjokehselko.supabase.co";

    // Hier denselben Publishable Key wie in deiner index.html einsetzen.
    const SUPABASE_KEY = "DEIN_SUPABASE_PUBLISHABLE_KEY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const params = new URLSearchParams(window.location.search);

    const thema = params.get("thema");
    const themaId = params.get("themaId");
    const headline = params.get("headline");
    const headlineId = params.get("headlineId");
    const teilnehmerId = params.get("teilnehmerId");

    const artikelBereich = document.getElementById("artikel");

    const artikelTexte = {

      schlaf: {
        kategorie: "Gesundheit",
        lead: "Schlaf spielt eine wichtige Rolle für die Konzentration. Besonders bei Jugendlichen kann eine unzureichende Nachtruhe den Alltag beeinflussen.",
        abschnitte: [
          {
            titel: "Warum Schlaf wichtig ist",
            text: "Während des Schlafs verarbeitet das Gehirn Informationen, die tagsüber aufgenommen wurden. Erlebnisse und neu Gelerntes werden dabei gefestigt. Ausreichender Schlaf ist deshalb wichtig für Gedächtnis und Lernfähigkeit."
          },
          {
            titel: "Auswirkungen auf den Schulalltag",
            text: "Wer zu wenig schläft, kann sich am nächsten Tag häufig schlechter konzentrieren. Auch die Aufmerksamkeit und die Reaktionsfähigkeit können beeinträchtigt sein. Gerade in der Schule kann sich das bemerkbar machen, wenn längere Zeit aufmerksam gearbeitet werden muss."
          },
          {
            titel: "Was den Schlaf beeinflusst",
            text: "Neben der Schlafdauer spielen auch regelmässige Schlafzeiten und die Schlafqualität eine Rolle. Ein unregelmässiger Tagesrhythmus oder die Nutzung elektronischer Geräte kurz vor dem Schlafengehen können das Einschlafen erschweren."
          },
          {
            titel: "Ein wichtiger Bestandteil des Alltags",
            text: "Schlaf ist kein nebensächlicher Teil des Tages, sondern beeinflusst verschiedene körperliche und geistige Prozesse. Fachleute empfehlen deshalb, auf einen möglichst regelmässigen Schlafrhythmus zu achten."
          }
        ]
      },

      social: {
        kategorie: "Gesellschaft",
        lead: "Soziale Medien gehören für viele Jugendliche zum Alltag. Gleichzeitig wird zunehmend untersucht, wie sich die Nutzung auf das Wohlbefinden auswirken kann.",
        abschnitte: [
          {
            titel: "Ein ständiger Vergleich",
            text: "Auf Plattformen wie Instagram oder TikTok werden häufig ausgewählte Ausschnitte aus dem Leben anderer Menschen gezeigt. Bilder von Ferien, Erfolgen oder besonderen Erlebnissen können den Eindruck vermitteln, dass das Leben anderer Menschen besonders perfekt verläuft."
          },
          {
            titel: "Mögliche Auswirkungen auf Jugendliche",
            text: "Forschende beschäftigen sich seit Jahren mit dem Zusammenhang zwischen der Nutzung sozialer Medien und dem psychischen Wohlbefinden. Dabei wird unter anderem untersucht, ob häufige Vergleiche mit anderen Menschen das Selbstbild beeinflussen können."
          },
          {
            titel: "Nicht alle Erfahrungen sind negativ",
            text: "Soziale Medien können auch positive Seiten haben. Sie ermöglichen es, mit Freunden in Kontakt zu bleiben, neue Interessen zu entdecken und sich über aktuelle Themen zu informieren. Entscheidend ist unter anderem, wie und wie lange die Plattformen genutzt werden."
          },
          {
            titel: "Bewusste Nutzung gewinnt an Bedeutung",
            text: "Ein bewusster Umgang mit sozialen Medien kann helfen, die eigene Nutzung besser einzuschätzen. Dazu gehört beispielsweise, Inhalte kritisch zu betrachten und sich nicht ausschliesslich an den Darstellungen anderer zu orientieren."
          }
        ]
      },

      fruehstueck: {
        kategorie: "Wissenschaft",
        lead: "Das Frühstück wird häufig als wichtiger Start in den Tag bezeichnet. Forschende untersuchen, welchen Zusammenhang die erste Mahlzeit des Tages mit der Konzentration haben könnte.",
        abschnitte: [
          {
            titel: "Energie für den Morgen",
            text: "Nach einer längeren Zeit ohne Nahrung benötigt der Körper wieder Energie. Das Frühstück kann dazu beitragen, den Energiebedarf am Morgen zu decken. Welche Lebensmittel dabei gewählt werden, unterscheidet sich von Person zu Person."
          },
          {
            titel: "Zusammenhang mit der Konzentration",
            text: "In verschiedenen Untersuchungen wird betrachtet, ob Menschen, die frühstücken, bei Aufgaben am Morgen andere Leistungen zeigen als Personen, die auf das Frühstück verzichten. Dabei spielen auch Faktoren wie Schlaf, Ernährung und allgemeine Lebensgewohnheiten eine Rolle."
          },
          {
            titel: "Nicht jedes Frühstück ist gleich",
            text: "Eine ausgewogene Mahlzeit kann beispielsweise aus Vollkornprodukten, Früchten, Milchprodukten oder anderen nährstoffreichen Lebensmitteln bestehen. Entscheidend ist nicht nur, ob jemand frühstückt, sondern auch die gesamte Ernährung."
          },
          {
            titel: "Individuelle Gewohnheiten",
            text: "Menschen haben unterschiedliche Tagesabläufe und Bedürfnisse. Während manche morgens gerne essen, haben andere zunächst keinen Appetit. Wie sich das auf die Konzentration auswirkt, kann deshalb nicht für alle Menschen gleich beantwortet werden."
          }
        ]
      },

      sport: {
        kategorie: "Gesundheit",
        lead: "Bewegung wirkt sich nicht nur auf die körperliche Fitness aus. Auch der Zusammenhang zwischen sportlicher Aktivität und psychischem Wohlbefinden wird wissenschaftlich untersucht.",
        abschnitte: [
          {
            titel: "Bewegung und Wohlbefinden",
            text: "Körperliche Aktivität kann verschiedene Prozesse im Körper beeinflussen. Viele Menschen berichten, dass sie sich nach Bewegung ausgeglichener oder entspannter fühlen. Auch wissenschaftliche Untersuchungen beschäftigen sich mit diesen Zusammenhängen."
          },
          {
            titel: "Sport im Alltag",
            text: "Dabei muss Bewegung nicht immer aus intensivem Training bestehen. Auch Spaziergänge, Velofahren oder andere alltägliche Aktivitäten können zur körperlichen Aktivität beitragen. Wichtig ist, dass Bewegung regelmässig in den Alltag integriert werden kann."
          },
          {
            titel: "Einfluss auf die psychische Gesundheit",
            text: "Studien zeigen Zusammenhänge zwischen körperlicher Aktivität und verschiedenen Aspekten des psychischen Wohlbefindens. Bewegung kann beispielsweise beim Umgang mit Stress eine unterstützende Rolle spielen. Die Wirkung ist jedoch individuell unterschiedlich."
          },
          {
            titel: "Mehr als sportliche Leistung",
            text: "Sport wird oft mit Leistung und Wettbewerb verbunden. Für das Wohlbefinden kann jedoch auch die Freude an der Bewegung wichtig sein. Entscheidend ist nicht unbedingt, wie schnell oder wie intensiv trainiert wird."
          }
        ]
      },

      plastik: {
        kategorie: "Umwelt",
        lead: "Plastik ist aus dem Alltag kaum wegzudenken. Gleichzeitig stellt die zunehmende Menge an Kunststoffabfällen eine Herausforderung für die Umwelt dar.",
        abschnitte: [
          {
            titel: "Ein weit verbreitetes Material",
            text: "Kunststoffe werden in zahlreichen Bereichen eingesetzt. Sie finden sich in Verpackungen, Kleidung, elektronischen Geräten und vielen weiteren Alltagsgegenständen. Ihre vielseitige Verwendung macht sie zu einem wichtigen Bestandteil moderner Gesellschaften."
          },
          {
            titel: "Folgen für die Umwelt",
            text: "Ein Teil des Plastikmülls gelangt in die Natur und kann dort über lange Zeit bestehen bleiben. Besonders Gewässer und Meere sind von Kunststoffabfällen betroffen. Tiere können Plastik aufnehmen oder sich darin verfangen."
          },
          {
            titel: "Mikroplastik als zusätzliche Herausforderung",
            text: "Durch Umwelteinflüsse kann Kunststoff in immer kleinere Teile zerfallen. Diese Partikel werden als Mikroplastik bezeichnet. Sie wurden bereits in unterschiedlichen Lebensräumen nachgewiesen. Welche langfristigen Folgen sie haben, wird weiterhin erforscht."
          },
          {
            titel: "Möglichkeiten zur Reduktion",
            text: "Weniger Einwegverpackungen, wiederverwendbare Produkte und eine bessere Abfallentsorgung können dazu beitragen, die Menge an Plastik in der Umwelt zu reduzieren. Auch Unternehmen und politische Entscheidungen spielen dabei eine wichtige Rolle."
          }
        ]
      }
    };

    function escapeHTML(text) {
      return String(text).replace(/[&<>"']/g, zeichen => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[zeichen]);
    }

    function zeigeArtikel() {
      if (!themaId || !headline || !teilnehmerId) {
        artikelBereich.innerHTML =
          '<p class="error">Der Artikel konnte nicht geladen werden. Es fehlen Angaben in der URL.</p>';
        return;
      }

      const artikel = artikelTexte[themaId];

      if (!artikel) {
        artikelBereich.innerHTML =
          '<p class="error">Für dieses Thema wurde kein Artikel gefunden.</p>';
        return;
      }

      const abschnitteHTML = artikel.abschnitte.map(abschnitt => `
        <h2>${escapeHTML(abschnitt.titel)}</h2>
        <p>${escapeHTML(abschnitt.text)}</p>
      `).join("");

      artikelBereich.innerHTML = `
        <div class="category">${escapeHTML(artikel.kategorie)}</div>

        <h1>${escapeHTML(headline)}</h1>

        <div class="meta">
          DIE NACHRICHTEN · WISSEN UND GESELLSCHAFT
        </div>

        <div class="lead">
          ${escapeHTML(artikel.lead)}
        </div>

        <div class="article-text">
          ${abschnitteHTML}
        </div>

        <div class="footer">
          Ende des Artikels
        </div>
      `;
    }

    // Artikel anzeigen
    zeigeArtikel();

    // Lesedauer messen
    const startzeit = Date.now();
    let gespeichert = false;

    async function speichereArtikelzeit() {
      if (gespeichert) return;

      gespeichert = true;

      const sekunden = Math.max(
        1,
        Math.round((Date.now() - startzeit) / 1000)
      );

      const { error } = await supabaseClient
        .from("Artikelzeiten")
        .insert({
          teilnehmer_id: teilnehmerId,
          thema: thema,
          headline_id: headlineId,
          headline: headline,
          sekunden: sekunden
        });

      if (error) {
        console.error("Fehler beim Speichern der Artikelzeit:", error);
      } else {
        console.log("Artikelzeit gespeichert:", sekunden, "Sekunden");
      }
    }

    // Zeit speichern, wenn die Artikelseite verlassen wird
    window.addEventListener("pagehide", speichereArtikelzeit);

    window.addEventListener("beforeunload", speichereArtikelzeit);

  </script>

</body>
</html>
